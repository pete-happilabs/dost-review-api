services:
  review-api:
    build: .
    ports:
      - "8013:8013"
    env_file: .env
    # .env holds host-oriented values (localhost:5433, a host ENGINE_PATH) that
    # would override the image's ENV inside the container — pin the two
    # container-scoped settings here (environment beats env_file in compose).
    environment:
      DATABASE_URL: postgresql://dost:dost@postgres:5432/dost_reviews
      ENGINE_PATH: /engine
      # Same reason: a host-oriented ONBOARD_DATABASE_URL from .env resolves to the
      # container itself, not the Onboard DB. Pinned empty so compose runs with
      # validation disabled; set it to a container-reachable host to enable.
      ONBOARD_DATABASE_URL: ""
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dost_reviews
      POSTGRES_USER: dost
      POSTGRES_PASSWORD: dost
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dost"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
