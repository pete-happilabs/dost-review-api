services:
  review-api:
    build: .
    ports:
      - "8013:8013"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dost_reviews
      POSTGRES_USER: dost
      POSTGRES_PASSWORD: dost
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dost"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
