name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dost_reviews
          POSTGRES_USER: dost
          POSTGRES_PASSWORD: dost
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://dost:dost@localhost:5433/dost_reviews
        run: pytest tests/ -v
